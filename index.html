<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADD TASK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="scene">
    <div class="board">

      <header class="board-head">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>Ledger</h1>
        </div>
        <div class="today">
          <span class="today-day" id="todayDay">01</span>
          <div class="today-meta">
            <span class="today-month" id="todayMonth">JAN</span>
            <span class="today-year" id="todayYear">2026</span>
          </div>
        </div>
      </header>

      <p class="board-sub">What needs doing today. Set a time and Ledger will not let you forget it.</p>

      <form class="composer" id="composer" autocomplete="off">
        <input type="text" id="taskInput" placeholder="Add a task — e.g. Send the invoice" maxlength="140" />
        <input type="datetime-local" id="taskWhen" />
        <button type="submit" class="composer-add" aria-label="Add task">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </form>

      <div class="list-meta">
        <span id="countLabel">No tasks yet</span>
        <button class="clear-done" id="clearDone" hidden>Clear completed</button>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <p class="empty-state" id="emptyState">
        Nothing on the ledger. Add your first task above.
      </p>

    </div>
  </div>

  <!-- Deadline alert -->
  <div class="alert-overlay" id="alertOverlay" hidden>
    <div class="alert-panel">
      <span class="alert-kicker">Deadline reached</span>
      <h2 class="alert-task" id="alertTaskName">Task name</h2>

      <div class="alert-media">
        <video id="alertVideo" playsinline></video>
      </div>

      <p class="alert-copy">If this isn't done yet, reschedule it now — Ledger will check again at the new time.</p>

      <div class="alert-actions">
        <button class="alert-btn alert-btn-ghost" id="alertSnooze">Reschedule 15 min</button>
        <button class="alert-btn alert-btn-primary" id="alertDismiss">Got it</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
